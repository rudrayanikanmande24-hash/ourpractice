<div class="card mb-4">
    <div class="card-body">
        <form #stdForm="ngForm" (ngSubmit)="onStdAdd()">
            <div class="form-group">
                <label for="fname">First Name</label>
                <input type="text" class="form-control" ngModel name="fname" id="fname">
            </div>
            <div class="form-group">
                <label for="lname">Last Name</label>
                <input type="text" class="form-control" ngModel name="lname" id="lname">
            </div>
            <div class="form-group">
                <label for="education">Education</label>
                <input type="text" class="form-control" ngModel name="education" id="education">
            </div>
             <div class="form-group">
                <label for="age">Age</label>
                <input type="text" class="form-control" ngModel name="age" id="age">
            </div>
             <div class="form-group">
                <label for="email">Email</label>
                <input type="text" class="form-control" ngModel name="email" id="email">
            </div>

        <button mat-raised-button color="primary" class="btn btn-block">Add Student</button>
        </form>
    </div>
</div>
